name: Build debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: btchat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to apk-output branch
        run: |
          set -e
          mkdir -p /tmp/apk-out
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apk-out/btchat-debug.apk
          cd /tmp/apk-out
          git init -q
          git checkout -q -b apk-output
          git config user.email "build@example.com"
          git config user.name "BtChat Build"
          git add btchat-debug.apk
          git commit -q -m "Built APK from commit ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -q --force origin HEAD:apk-output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
